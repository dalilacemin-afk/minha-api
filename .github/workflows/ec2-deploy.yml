name: Deploy na AWS EC2

on:
  workflow_run:
    workflows: ["Build e Push Docker Hub"]
    types:
      - completed
    branches:
      - main
      - develop

jobs:

  Homologacao:
    name: Deploy em Homologação
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    environment: homologacao

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG
          script: |
            echo "$DOCKERHUB_TOKEN" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            sudo docker pull "$DOCKERHUB_USERNAME/senai_fastapi:$IMAGE_TAG"
            sudo docker stop senai_homologacao 2>/dev/null || true
            sudo docker rm senai_homologacao 2>/dev/null || true
            sudo docker run -d --name senai_homologacao --restart unless-stopped -p 8080:8080 "$DOCKERHUB_USERNAME/senai_fastapi:$IMAGE_TAG"
            sleep 5
            curl -f http://localhost:8080/health

  Producao:
    name: Deploy em Produção
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: producao

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG
          script: |
            echo "$DOCKERHUB_TOKEN" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            sudo docker pull "$DOCKERHUB_USERNAME/senai_fastapi:$IMAGE_TAG"
            sudo docker stop senai_producao 2>/dev/null || true
            sudo docker rm senai_producao 2>/dev/null || true
            sudo docker run -d --name senai_producao --restart unless-stopped -p 8081:8080 "$DOCKERHUB_USERNAME/senai_fastapi:$IMAGE_TAG"
            sleep 5
            curl -f http://localhost:8081/health
