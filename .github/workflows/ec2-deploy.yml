name: Deploy na AWS EC2

on:
  workflow_run:
    workflows: ["Build e Push Docker Hub"]
    types:
      - completed

jobs:
  Deploy:
    name: Implantação na Instância AWS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull da imagem mais recente
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest

            # Parar e remover container antigo
            sudo docker stop senai_fastapi 2>/dev/null || true
            sudo docker rm senai_fastapi 2>/dev/null || true

            # Subir o novo container na porta 8080
            sudo docker run -d \
              --name senai_fastapi \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest

            # Health check na EC2
            sleep 5
            curl -f http://localhost:8080/health || exit 1
            echo "Deploy finalizado com sucesso!"

            # Limpeza de imagens antigas não utilizadas
            sudo docker image prune -f