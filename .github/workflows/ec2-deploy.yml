name: Deploy na AWS EC2

on:
  workflow_run:
    workflows: ["Build e Push Docker Hub"]
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  Homologacao:
    name: Deploy em Homologação
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - name: Deploy via SSH na EC2 de Homologação
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:${{ github.event.workflow_run.head_sha }}"
            sudo docker pull "$IMAGE"
            sudo docker stop senai_homologacao 2>/dev/null || true
            sudo docker rm senai_homologacao 2>/dev/null || true
            sudo docker run -d --name senai_homologacao --restart unless-stopped -p 8080:8080 "$IMAGE"
            sleep 5
            curl -f http://localhost:8080/health

  Producao:
    name: Deploy em Produção
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - name: Deploy via SSH na EC2 de Produção
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USERNAME_PROD }}
          key: ${{ secrets.EC2_SSH_KEY_PROD }}
          script: |
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:${{ github.event.workflow_run.head_sha }}"
            sudo docker pull "$IMAGE"
            sudo docker stop senai_producao 2>/dev/null || true
            sudo docker rm senai_producao 2>/dev/null || true
            sudo docker run -d --name senai_producao --restart unless-stopped -p 80:8080 "$IMAGE"
            sleep 5
            curl -f http://localhost/health
